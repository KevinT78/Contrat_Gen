# Un tag vX.Y.Z pousse sur GitHub = une mise en production de Contrat_Gen.
#   git tag v1.0.0 && git push origin v1.0.0
# Tests -> image ghcr.io/kevint78/contrat_gen:<tag> -> deploiement sur le VPS
# en SSH (deploy/deployer.sh, retour automatique a la version precedente si
# le conteneur n'est pas sain).
name: Déploiement production

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

# Jamais deux mises en production en meme temps.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        run: |
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done

  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/kevint78/contrat_gen:${{ github.ref_name }}

  production:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Déployer sur le VPS
        env:
          TAG: ${{ github.ref_name }}
          VPS_HOTE: ${{ secrets.VPS_HOTE }}
          VPS_SSH_CLE: ${{ secrets.VPS_SSH_CLE }}
          VPS_HOTE_CONNU: ${{ secrets.VPS_HOTE_CONNU }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_CLE" > ~/.ssh/deploiement && chmod 600 ~/.ssh/deploiement
          printf '%s\n' "$VPS_HOTE_CONNU" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploiement -o StrictHostKeyChecking=yes "deploiement@$VPS_HOTE" "$TAG"
