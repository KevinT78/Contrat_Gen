<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titre %}{{ client }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
  /* Swiss Modernism : grille stricte, filets d'1px, un seul accent, pas
     d'ombre. La hierarchie vient de la taille, de la graisse et du blanc. */
  :root {
    --fond:#f7f6f2; --surface:#fff; --surface-2:#faf9f5;
    --bord:#e6e3da; --bord-fort:#cdc9bd;
    --texte:#14140f; --gris:#66645b; --gris-clair:#95928a;
    --accent:#1f4d3f; --accent-sombre:#143229; --accent-clair:#e7efeb;
    --alerte:#8a2e21; --alerte-clair:#f7e9e5;
    --attente:#7a5510; --attente-clair:#f8efdc;
    /* fonds de ligne du suivi : une teinte par famille d'etat (memes hues
       que les badges), + une variante -survol un cran plus soutenue */
    --attente-fond:#f6ead0; --attente-survol:#eeddb6;
    --actif-fond:#e2eee7;   --actif-survol:#cfe4d9;
    --alerte-fond:#f3dbd2;  --alerte-survol:#e8c6ba;
    --fini-fond:#e7eae1;    --fini-survol:#d7dbcc;
    --fini:#5a6b60;   /* gris-vert desature : parcours termine */
    --r:3px;
    --titre:"Libre Bodoni","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --corps:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
    --pas:.15s cubic-bezier(.2,0,.2,1);
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--fond); color:var(--texte);
         font:400 14px/1.6 var(--corps); -webkit-font-smoothing:antialiased;
         font-variant-numeric:tabular-nums }
  a { color:var(--accent) }
  :focus-visible { outline:1.5px solid var(--accent); outline-offset:2px }
  code, .mono { font-family:var(--mono); font-size:11.5px; letter-spacing:.02em;
                color:var(--gris) }

  /* --- en-tete --- */
  header { height:60px; padding:0 40px; display:flex; align-items:center; gap:32px;
           background:var(--surface); border-bottom:1px solid var(--bord) }
  .marque { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--texte);
            font-family:var(--titre); font-size:16px; font-weight:500; letter-spacing:.01em }
  .marque i { width:26px; height:26px; background:var(--accent); color:#fff; font-style:normal;
              display:grid; place-items:center; font-family:var(--corps); font-size:10px;
              font-weight:600; letter-spacing:.06em; line-height:1 }
  header nav { display:flex; gap:24px; margin-left:8px; align-self:stretch }
  header nav a { position:relative; display:flex; align-items:center; font-size:12px;
                 font-weight:500; letter-spacing:.1em; text-transform:uppercase;
                 color:var(--gris); text-decoration:none; transition:color var(--pas) }
  header nav a:hover { color:var(--texte) }
  header nav a[aria-current] { color:var(--accent) }
  header nav a[aria-current]::after { content:""; position:absolute; left:0; right:0; bottom:-1px;
                 height:2px; background:var(--accent) }
  .utilisateur { margin-left:auto; font-size:12px; letter-spacing:.02em; color:var(--gris-clair) }
  .utilisateur a { color:var(--gris); text-decoration:none; border-bottom:1px solid var(--bord-fort) }
  .utilisateur a:hover { color:var(--accent); border-color:var(--accent) }

  /* --- structure --- */
  main { max-width:1080px; margin:0 auto; padding:48px 40px 120px }
  main.etroit { max-width:460px; padding-top:96px }
  main.large { max-width:1320px }
  h1 { font:500 34px/1.15 var(--titre); letter-spacing:-.005em; margin:0 0 10px }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.14em; font-weight:600;
       color:var(--gris-clair); margin:48px 0 14px; padding-bottom:10px;
       border-bottom:1px solid var(--bord) }
  .sous { color:var(--gris); margin:0 0 36px; display:flex; flex-wrap:wrap;
          align-items:center; gap:14px; font-size:13.5px }
  .sous .filet { width:1px; height:12px; background:var(--bord-fort) }
  .retour { display:inline-block; margin:0 0 22px; font-size:12px; letter-spacing:.02em;
            color:var(--gris); text-decoration:none }
  .retour:hover { color:var(--accent) }
  .carte { background:var(--surface); border:1px solid var(--bord); border-radius:var(--r);
           padding:28px 32px; margin-bottom:20px }
  .carte > :first-child { margin-top:0 } .carte > :last-child { margin-bottom:0 }
  .titre-carte { font-size:11px; text-transform:uppercase; letter-spacing:.14em;
                 font-weight:600; color:var(--gris-clair); margin:0 0 20px }
  .sep { border:0; border-top:1px solid var(--bord); margin:28px -32px }
  .duo { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);
         gap:0 48px; align-items:start }
  /* titre a gauche, action secondaire a droite -- les filtres ont leur propre
     rangee pleine largeur (.barre-filtres), sous le sous-titre */
  .entete { display:flex; justify-content:space-between; align-items:flex-start;
            gap:32px; margin:0 0 26px }
  .entete .sous { margin-bottom:0 }

  /* --- tableau --- */
  .tableau { background:var(--surface); border:1px solid var(--bord); border-radius:var(--r);
             overflow-x:auto }
  table { width:100%; border-collapse:collapse; font-size:13.5px }
  th,td { text-align:left; padding:15px 20px; border-bottom:1px solid var(--bord);
          white-space:nowrap }
  th:last-child, td:last-child { text-align:right }
  thead th { padding-top:13px; padding-bottom:13px; font-size:10.5px; font-weight:600;
             text-transform:uppercase; letter-spacing:.12em; color:var(--gris-clair) }
  tbody tr:last-child td { border-bottom:0 }
  tbody tr { transition:background var(--pas) }
  /* couleur de ligne : filet de ton a gauche + fond teinte, une teinte par
     famille d'etat (memes hues que les badges). Le survol fonce la teinte,
     sinon il effacerait l'etat. */
  .tableau tbody td:first-child { border-left:4px solid transparent }
  .tableau tr.ton-attente td:first-child { border-left-color:var(--attente) }
  .tableau tr.ton-actif   td:first-child { border-left-color:var(--accent) }
  .tableau tr.ton-ko      td:first-child { border-left-color:var(--alerte) }
  .tableau tr.ton-fini    td:first-child { border-left-color:var(--fini) }
  .tableau tr.ton-attente td { background:var(--attente-fond) }
  .tableau tr.ton-actif   td { background:var(--actif-fond) }
  .tableau tr.ton-ko      td { background:var(--alerte-fond) }
  .tableau tr.ton-fini    td { background:var(--fini-fond) }
  tbody tr:hover td { background:var(--surface-2) }
  .tableau tr.ton-attente:hover td { background:var(--attente-survol) }
  .tableau tr.ton-actif:hover   td { background:var(--actif-survol) }
  .tableau tr.ton-ko:hover      td { background:var(--alerte-survol) }
  .tableau tr.ton-fini:hover    td { background:var(--fini-survol) }
  tr.inactif td { color:var(--gris-clair) }
  .nom { font-weight:500; color:var(--texte); text-decoration:none;
         border-bottom:1px solid var(--bord-fort); transition:border-color var(--pas) }
  .nom:hover { color:var(--accent); border-color:var(--accent) }
  .secondaire { color:var(--gris) }

  /* --- etats : pastille + libelle, pas de pilule --- */
  .badge { display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:500;
           color:var(--gris); white-space:nowrap }
  .badge::before { content:""; width:6px; height:6px; border-radius:50%;
                   background:var(--gris-clair) }
  .badge.actif { color:var(--accent) } .badge.actif::before { background:var(--accent) }
  .badge.attente { color:var(--attente) } .badge.attente::before { background:var(--attente) }
  .badge.ko { color:var(--alerte) } .badge.ko::before { background:var(--alerte) }
  .badge.fini { color:var(--fini) } .badge.fini::before { background:var(--fini) }
  .badge.nu::before { display:none }

  /* --- fil d'etapes : points relies par un trait ; le segment courant (du point
     atteint vers le suivant) defile, avec « etape en cours » centre dessous --- */
  .etapes { display:flex; list-style:none; margin:0 0 44px; padding:0 }
  .etapes li { flex:1; position:relative; padding:24px 16px 0 0; font-size:10.5px;
               font-weight:500; text-transform:uppercase; letter-spacing:.1em;
               color:var(--gris-clair) }
  /* le trait de CE li = le segment qui va de son point au point suivant */
  .etapes li::before { content:""; position:absolute; top:0; left:0; right:0; height:2px;
                       background:var(--bord) }
  .etapes li::after { content:""; position:absolute; top:-3px; left:0; width:8px; height:8px;
                      border-radius:50%; background:var(--bord-fort) }
  .etapes li.faite { color:var(--gris) }
  .etapes li.faite::before { background:var(--accent); opacity:.55 }
  .etapes li.faite::after { background:var(--accent); opacity:.55 }
  .etapes li.faite .jalon::before { content:"\2713"; margin-right:.5em; color:var(--accent);
             font-weight:700 }
  .etapes li.ici { color:var(--accent); font-weight:700 }
  .etapes li.ici::after { background:var(--accent); box-shadow:0 0 0 4px var(--accent-clair) }
  .etapes li.ici::before {
             background:var(--bord);
             background-image:linear-gradient(90deg, var(--accent) 0 45%, transparent 45%);
             background-size:12px 100%; background-repeat:repeat-x;
             animation:frise-avance .65s linear infinite }
  .etapes li.ici:last-child::before {          /* dernier etat : rien a parcourir */
             background:var(--accent); background-image:none; opacity:.55; animation:none }
  @keyframes frise-avance { to { background-position:12px 0 } }
  .etapes li .jalon-etat { position:absolute; top:8px; left:0; right:0; text-align:center;
             font-size:8.5px; font-weight:600; letter-spacing:.14em; color:var(--accent);
             line-height:1 }

  /* --- formulaires --- */
  label { display:block; margin:0 0 7px; font-size:11px; font-weight:600; letter-spacing:.08em;
          text-transform:uppercase; color:var(--gris) }
  label .aide { font-weight:400; letter-spacing:.02em; text-transform:none;
                color:var(--gris-clair) }
  .champ { margin-bottom:20px }
  .grille-champs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
                   gap:20px 40px; align-items:end }
  .grille-champs > .champ { margin-bottom:0 }
  .grille-champs .pleine { grid-column:1/-1 }
  input,select,textarea { width:100%; padding:8px 0; border:0;
           border-bottom:1px solid var(--bord-fort); background:transparent; color:var(--texte);
           font-family:var(--corps); font-size:14px; border-radius:0;
           transition:border-color var(--pas), box-shadow var(--pas) }
  input:hover,select:hover,textarea:hover { border-bottom-color:var(--gris-clair) }
  input:focus,select:focus,textarea:focus { outline:none; border-bottom-color:var(--accent);
           box-shadow:0 1px 0 0 var(--accent) }
  input::placeholder { color:var(--gris-clair) }
  textarea { resize:vertical; line-height:1.6; padding:12px 14px;
             border:1px solid var(--bord-fort); border-radius:var(--r) }
  textarea:focus { box-shadow:0 0 0 1px var(--accent); border-color:var(--accent) }
  select { appearance:none; padding-right:24px; background-repeat:no-repeat;
           background-position:right 2px center;
           background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='11' viewBox='0 0 12 12'><path d='M2 4.5 6 8.5 10 4.5' fill='none' stroke='%2366645b' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/></svg>") }
  /* champ fichier francise (le bouton natif est en anglais et non stylable
     partout) : l'input reel est masque, un bouton + un libelle le remplacent */
  .fichier { position:relative; display:inline-flex; align-items:center; flex-wrap:wrap;
             gap:8px 14px; padding:9px 0; font-size:13px; color:var(--gris) }
  .fichier input[type=file] { position:absolute; width:1px; height:1px; padding:0;
             opacity:0; overflow:hidden; pointer-events:none }
  .fichier .parcourir { padding:6px 14px; cursor:pointer; font-family:var(--corps);
             font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
             color:var(--texte); background:transparent; border:1px solid var(--bord-fort);
             border-radius:var(--r); transition:color var(--pas), border-color var(--pas) }
  .fichier .parcourir:hover { border-color:var(--accent); color:var(--accent) }
  .fichier + .aide { display:block; margin-top:2px }
  ul.chips { list-style:none; display:flex; flex-wrap:wrap; gap:8px;
             margin:8px 0 0; padding:0 }
  ul.chips:empty { display:none }
  ul.chips li { display:inline-flex; align-items:center; gap:8px; padding:4px 6px 4px 12px;
             font-size:12.5px; color:var(--accent); background:var(--accent-clair);
             border-radius:var(--r) }
  ul.chips li::before { content:"\2713"; font-weight:700 }
  ul.chips .x { min-width:0; padding:0 6px; margin:0; border:0; background:transparent;
             color:var(--accent); font-size:15px; line-height:1; cursor:pointer;
             text-transform:none; letter-spacing:0 }
  ul.chips .x:hover { background:transparent; color:var(--alerte) }

  /* --- boutons --- */
  button, .bouton { display:inline-flex; align-items:center; justify-content:center; gap:10px;
           padding:11px 22px; border:1px solid var(--accent); background:var(--accent); color:#fff;
           font-family:var(--corps); font-size:11.5px; font-weight:600; letter-spacing:.1em;
           text-transform:uppercase; line-height:1.4; border-radius:var(--r); cursor:pointer;
           text-decoration:none; transition:background var(--pas), color var(--pas),
           border-color var(--pas) }
  button:hover, .bouton:hover { background:var(--accent-sombre); border-color:var(--accent-sombre) }
  button:disabled { opacity:.35; cursor:not-allowed; background:var(--accent) }
  button.discret, .bouton.discret { background:transparent; color:var(--texte);
           border-color:var(--bord-fort) }
  button.discret:hover, .bouton.discret:hover { background:transparent; color:var(--accent);
           border-color:var(--accent) }
  button.danger { background:transparent; color:var(--alerte); border-color:var(--bord-fort) }
  button.danger:hover { background:transparent; color:var(--alerte); border-color:var(--alerte) }
  .actions { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-end }
  .actions form { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-end }
  .actions .champ { margin-bottom:0; min-width:280px }
  /* rangee de filtres pleine largeur, cadree par deux filets */
  .barre-filtres { display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 36px;
           margin:0 0 26px; padding:14px 0; border-top:1px solid var(--bord);
           border-bottom:1px solid var(--bord) }
  .barre-filtres .champ { margin-bottom:0; flex:0 1 240px }
  .barre-filtres .fin { margin-left:auto; display:flex; flex-wrap:wrap; gap:12px }
  .pied-actions { display:flex; justify-content:flex-end; margin:-4px 0 20px }
  .indice { font-size:12.5px; color:var(--gris); margin:16px 0 0; max-width:62ch }
  .indice.manque { color:var(--alerte) }

  /* --- messages --- */
  .msg { padding:16px 20px; margin:0 0 24px; background:var(--surface);
         border:1px solid var(--bord); border-left:2px solid var(--accent); border-radius:var(--r) }
  .msg.erreur { background:var(--alerte-clair); border-color:#e8d2cb;
                border-left-color:var(--alerte); color:var(--alerte) }

  /* --- listes --- */
  ul.docs { list-style:none; padding:0; margin:0; font-size:13.5px }
  ul.docs li { padding:13px 0; border-bottom:1px solid var(--bord) }
  ul.docs li:first-child { padding-top:0 }
  ul.docs li:last-child { padding-bottom:0; border-bottom:0 }
  ul.docs a { display:flex; align-items:center; gap:12px; color:var(--texte);
              text-decoration:none; overflow-wrap:anywhere; transition:color var(--pas) }
  ul.docs a::before { content:""; flex:0 0 auto; width:13px; height:16px; opacity:.5;
              background:no-repeat center/13px 16px
              url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='16' viewBox='0 0 14 16'><path d='M2.5 1.5h5.5l3.5 3.5v9.5h-9z' fill='none' stroke='%2314140f' stroke-width='1'/><path d='M8 1.5V5h3.5' fill='none' stroke='%2314140f' stroke-width='1'/></svg>") }
  ul.docs a:hover { color:var(--accent) }
  .manque { color:var(--alerte) }
  .vide { color:var(--gris-clair); font-family:var(--titre); font-style:italic; font-size:14px }
  .infos { margin:0; font-size:14px; display:grid;
           grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0 40px }
  .infos > div { padding:14px 0 }
  .infos > div:nth-child(n+3) { border-top:1px solid var(--bord) }
  .infos > div:nth-child(-n+2) { padding-top:0 }
  .infos dt { font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
              color:var(--gris-clair); margin-bottom:4px }
  .infos dd { margin:0; overflow-wrap:anywhere }
  .journal { list-style:none; margin:0; padding:0; font-size:13px; color:var(--gris) }
  .journal li { position:relative; padding:0 0 20px 24px; border-left:1px solid var(--bord) }
  .journal li:last-child { padding-bottom:0; border-left-color:transparent }
  .journal li::before { content:""; position:absolute; left:-3px; top:7px; width:5px; height:5px;
              border-radius:50%; background:var(--bord-fort); box-shadow:0 0 0 4px var(--surface) }
  .journal li:first-child::before { background:var(--accent) }
  .journal time { font-family:var(--mono); font-size:11.5px; color:var(--gris-clair);
                  margin-right:10px }
  .journal b { color:var(--texte); font-weight:600 }

  @media (prefers-reduced-motion: reduce) {
    * { transition:none !important }
    .etapes li.ici::before { animation:none;
             background:var(--accent); background-image:none; opacity:.55 }
  }
</style>
</head>
<body>
<header>
  <a class="marque" href="/"><i>{{ client[:2]|upper }}</i>{{ client }}</a>
  {% if session.utilisateur %}
    <nav>
      <a href="{{ url_for('suivi') }}"
         {{ 'aria-current=page'|safe if request.endpoint in ('suivi', 'detail') }}>Suivi</a>
      <a href="{{ url_for('salaries') }}"
         {{ 'aria-current=page'|safe if request.endpoint == 'salaries' }}>Salariés</a>
    </nav>
    <span class="utilisateur">{{ session.utilisateur }} —
      <a href="{{ url_for('logout') }}">quitter</a></span>
  {% endif %}
</header>
<main class="{% block classe_main %}{% endblock %}">
  {% for cat, m in get_flashed_messages(with_categories=true) %}
    <p class="msg {{ 'erreur' if cat == 'erreur' }}">{{ m }}</p>
  {% endfor %}
  {% block corps %}{% endblock %}
</main>
<script>
  /* francise chaque <input type=file> : bouton « Parcourir » + nom du/des fichier(s) */
  for (const inp of document.querySelectorAll('input[type=file]')) {
    const vide = 'Aucun fichier sélectionné';
    const enrobe = document.createElement('span');
    enrobe.className = 'fichier';
    const bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'parcourir';
    bouton.textContent = 'Parcourir…';
    const etat = document.createElement('span');
    etat.textContent = vide;
    inp.parentNode.insertBefore(enrobe, inp);
    enrobe.append(bouton, inp, etat);
    bouton.addEventListener('click', () => inp.click());
    inp.addEventListener('change', () => {
      const n = inp.files.length;
      etat.textContent = n === 0 ? vide
        : n === 1 ? inp.files[0].name
        : n + ' fichiers sélectionnés';
    });
  }
</script>
</body>
</html>
