<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 690" font-family="Segoe UI, Arial, sans-serif">
  <!-- Tout vit dans MongoDB : un dossier est un document (collection dossiers),
       ses pieces des documents de la collection fichiers. Rien n'est copie ni
       deplace : « Accepter » et « Remettre » changent le document sur place.
       Le zip d'export (DOSSIERS SALARIES / LEAVERS) est calcule a la demande. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <g font-size="12.5" fill="#64748b" font-style="italic" text-anchor="end">
    <text x="110" y="41">Manager</text>
    <text x="110" y="146">Système</text>
    <text x="110" y="288">RH</text>
    <text x="110" y="431">RH</text>
    <text x="110" y="560">Cron hebdo</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,3">
    <line x1="118" y1="37"  x2="200" y2="37"/>
    <line x1="118" y1="142" x2="200" y2="142"/>
    <line x1="118" y1="284" x2="150" y2="284"/>
    <line x1="118" y1="427" x2="150" y2="427"/>
    <line x1="118" y1="556" x2="200" y2="556"/>
  </g>

  <rect x="200" y="10" width="420" height="54" rx="8" fill="#0d4437"/>
  <text x="410" y="43" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">Formulaire public + pièces jointes</text>
  <line x1="410" y1="64" x2="410" y2="108" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="420" y="92" font-size="12.5" fill="#475569">mail « nouvelle_soumission » au service RH</text>

  <rect x="200" y="112" width="420" height="60" rx="8" fill="#1e293b"/>
  <text x="410" y="136" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">MongoDB : dossiers + fichiers</text>
  <text x="410" y="158" text-anchor="middle" fill="#cbd5e1" font-size="12.5" font-family="Consolas, monospace">_id &lt;ULID&gt; · zone soumissions · état Soumise</text>
  <line x1="410" y1="172" x2="410" y2="216" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="420" y="200" font-size="12.5" fill="#475569">« Accepter » : même document, même ULID</text>

  <rect x="150" y="220" width="520" height="140" rx="8" fill="#1e293b"/>
  <text x="410" y="245" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Le dossier du salarié (zone documents)</text>
  <g font-size="12.5" fill="#fff" font-family="Consolas, monospace">
    <text x="180" y="276">journal</text><text x="180" y="298">FICHE PERSONNELLE</text>
    <text x="180" y="320">CONTRAT</text><text x="180" y="342">_versions</text>
  </g>
  <g font-size="12.5" fill="#cbd5e1">
    <text x="370" y="276">append-only, état courant</text>
    <text x="370" y="298">pièces du candidat, fiche salarié</text>
    <text x="370" y="320">contrat .docx, contrat signé, accusé DPAE</text>
    <text x="370" y="342">anciennes versions d'un fichier remplacé</text>
  </g>
  <line x1="410" y1="360" x2="410" y2="404" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="420" y="388" font-size="12.5" fill="#475569">« Remettre au cabinet comptable » : état RemisComptable</text>

  <rect x="150" y="408" width="520" height="86" rx="8" fill="#1e293b"/>
  <text x="410" y="433" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Aucune copie : le lot est servi en direct</text>
  <text x="410" y="455" text-anchor="middle" fill="#cbd5e1" font-size="12.5">/lot/&lt;jeton&gt; lit les pièces du dossier, sans le contrat signé ni _versions</text>
  <text x="410" y="476" text-anchor="middle" fill="#a7c4ba" font-size="12.5">un re-dépôt après la remise apparaît dans le lot</text>
  <line x1="410" y1="494" x2="410" y2="532" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="420" y="518" font-size="12.5" fill="#475569">recap.py, une fois par semaine</text>

  <rect x="200" y="536" width="420" height="54" rx="8" fill="#b45309"/>
  <text x="410" y="558" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Mail au cabinet comptable</text>
  <text x="410" y="578" text-anchor="middle" fill="#fde68a" font-size="12.5">un lien signé par dossier (/lot/…), valable 30 jours</text>

  <rect x="690" y="408" width="120" height="86" rx="8" fill="#475569"/>
  <text x="750" y="436" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Export zip</text>
  <text x="750" y="456" text-anchor="middle" fill="#e2e8f0" font-size="11.5" font-family="Consolas, monospace">DOSSIERS SALARIES/</text>
  <text x="750" y="474" text-anchor="middle" fill="#e2e8f0" font-size="11.5" font-family="Consolas, monospace">LEAVERS/</text>
  <line x1="670" y1="451" x2="686" y2="451" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="750" y="510" text-anchor="middle" font-size="11.5" fill="#64748b" font-style="italic">à la demande, flux</text>

  <text x="410" y="634" font-size="12.5" fill="#64748b" text-anchor="middle" font-style="italic">Rien n'est écrit sur le disque du serveur : la base est la seule source de vérité.</text>
  <text x="410" y="654" font-size="12.5" fill="#64748b" text-anchor="middle" font-style="italic">L'arborescence de l'export est recalculée depuis la configuration courante.</text>
</svg>
