<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Segoe UI, Arial, sans-serif">
  <!-- Ce que contient config/, comment c'est lu, et le garde-fou qui decide
       si l'instance sert ou non. Les deux issues de verifier() sont cote a cote
       pour qu'on voie qu'il n'y a pas de mode degrade. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="620" height="150" rx="8" fill="#1e293b"/>
  <text x="320" y="34" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">config/  (CONFIG_DIR) — des données, ni code ni secret</text>
  <g font-size="12" fill="#cbd5e1">
    <text x="28" y="60" font-family="Consolas, monospace" fill="#fff">instance.json</text>
    <text x="150" y="60">client, mails, signature,</text>
    <text x="150" y="77">modèles par poste, conservation…</text>
    <text x="28" y="100" font-family="Consolas, monospace" fill="#fff">formulaire.json</text>
    <text x="150" y="100">champs et rôles</text>
    <text x="28" y="121" font-family="Consolas, monospace" fill="#fff">societes.amorce.json</text>
    <text x="190" y="121">jeu de départ (démo, tests)</text>
    <text x="28" y="142" font-family="Consolas, monospace" fill="#fff">grille.json</text>
    <text x="150" y="142">salaires (optionnel)</text>
    <text x="350" y="60" font-family="Consolas, monospace" fill="#fff">contrats/</text>
    <text x="470" y="60">modèles .docx, .html</text>
    <text x="350" y="81" font-family="Consolas, monospace" fill="#fff">mails/</text>
    <text x="470" y="81">modèles .txt</text>
    <text x="350" y="102" font-family="Consolas, monospace" fill="#fff">theme.json</text>
    <text x="470" y="102">couleurs</text>
    <text x="350" y="123" font-family="Consolas, monospace" fill="#fff">marque/</text>
    <text x="470" y="123">logo</text>
    <text x="350" y="142" font-family="Consolas, monospace" fill="#fff">PLACEHOLDERS.md</text>
    <text x="470" y="142">jetons valides</text>
  </g>
  <line x1="320" y1="160" x2="320" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="180" font-size="12.5" fill="#475569">lu au démarrage, gardé en cache</text>

  <rect x="120" y="194" width="400" height="56" rx="8" fill="#b45309"/>
  <text x="320" y="217" text-anchor="middle" fill="#fff" font-size="15" font-weight="600" font-family="Consolas, monospace">config.py</text>
  <text x="320" y="238" text-anchor="middle" fill="#fde68a" font-size="12.5">rôles du formulaire, mentions, grille ; sociétés lues en base</text>
  <line x1="320" y1="250" x2="320" y2="278" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="60" y="282" width="520" height="62" rx="8" fill="#0d4437"/>
  <text x="320" y="306" text-anchor="middle" fill="#fff" font-size="15" font-weight="600" font-family="Consolas, monospace">config.verifier()</text>
  <text x="320" y="328" text-anchor="middle" fill="#a7c4ba" font-size="12">version, variables d'environnement, comptes et sociétés en base, mails…</text>
  <line x1="200" y1="344" x2="160" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="344" x2="480" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="10" y="374" width="300" height="48" rx="8" fill="#b91c1c"/>
  <text x="160" y="395" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">incomplète ou dangereuse</text>
  <text x="160" y="413" text-anchor="middle" fill="#fecaca" font-size="12">refus de démarrer, cause affichée</text>
  <rect x="330" y="374" width="300" height="48" rx="8" fill="#1e293b"/>
  <text x="480" y="395" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">valide</text>
  <text x="480" y="413" text-anchor="middle" fill="#cbd5e1" font-size="12">l'application sert</text>
</svg>
