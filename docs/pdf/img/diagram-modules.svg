<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 486" font-family="Segoe UI, Arial, sans-serif">
  <!-- Largeur 640 : une fois reduit a la largeur de page, le texte de 12.5 reste
       autour de 9 pt. Les six modules sont dans un cadre unique plutot que relies
       un par un a app.py : six fleches se croisaient. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="120" y="10" width="400" height="44" rx="8" fill="#0d4437"/>
  <text x="320" y="38" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Navigateur : manager, RH, cabinet</text>
  <line x1="320" y1="54" x2="320" y2="82" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="73" font-size="12.5" fill="#475569">HTTP, un seul process (waitress)</text>

  <rect x="120" y="86" width="400" height="58" rx="8" fill="#1e293b"/>
  <text x="320" y="110" text-anchor="middle" fill="#fff" font-size="15" font-weight="600" font-family="Consolas, monospace">app.py</text>
  <text x="320" y="131" text-anchor="middle" fill="#cbd5e1" font-size="12.5">routes, accès, rate-limit, effets des transitions</text>
  <line x1="320" y1="144" x2="320" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="10" y="176" width="620" height="176" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="26" y="196" font-size="12" fill="#64748b" font-style="italic">appelés par app.py</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="24" y="206" width="188" height="58" rx="6" fill="#1e293b"/>
    <text x="118" y="229" fill="#fff" font-weight="600" font-family="Consolas, monospace">store.py</text>
    <text x="118" y="250" fill="#a7c4ba">MongoDB : dossiers, fichiers</text>
    <rect x="226" y="206" width="188" height="58" rx="6" fill="#1e293b"/>
    <text x="320" y="229" fill="#fff" font-weight="600" font-family="Consolas, monospace">contrat.py</text>
    <text x="320" y="250" fill="#a7c4ba">jetons → contrat .docx</text>
    <rect x="428" y="206" width="188" height="58" rx="6" fill="#1e293b"/>
    <text x="522" y="229" fill="#fff" font-weight="600" font-family="Consolas, monospace">mails.py</text>
    <text x="522" y="250" fill="#a7c4ba">modèles .txt, SMTP</text>

    <rect x="24" y="280" width="188" height="58" rx="6" fill="#475569"/>
    <text x="118" y="303" fill="#fff" font-weight="600" font-family="Consolas, monospace">signature.py</text>
    <text x="118" y="324" fill="#e2e8f0">Yousign (optionnel)</text>
    <rect x="226" y="280" width="188" height="58" rx="6" fill="#475569"/>
    <text x="320" y="303" fill="#fff" font-weight="600" font-family="Consolas, monospace">sharepoint.py</text>
    <text x="320" y="324" fill="#e2e8f0">import Graph (optionnel)</text>
    <rect x="428" y="280" width="188" height="58" rx="6" fill="#475569"/>
    <text x="522" y="303" fill="#fff" font-weight="600" font-family="Consolas, monospace">excel.py</text>
    <text x="522" y="324" fill="#e2e8f0">lecture des .xlsx</text>
  </g>
  <line x1="320" y1="352" x2="320" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="371" font-size="12.5" fill="#475569">tous lisent la configuration</text>

  <rect x="120" y="384" width="400" height="58" rx="8" fill="#b45309"/>
  <text x="320" y="408" text-anchor="middle" fill="#fff" font-size="15" font-weight="600" font-family="Consolas, monospace">config.py</text>
  <text x="320" y="429" text-anchor="middle" fill="#fde68a" font-size="12.5">lit config/, sociétés et comptes en base, verifier()</text>

  <text x="320" y="468" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Les scripts (installer, configurer, doctor, recap, purger…) appellent les mêmes modules, sans app.py.</text>
</svg>
